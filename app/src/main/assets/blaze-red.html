<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS Blaze Red Core</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000 !important;
    background: #000000 !important;
    overflow: hidden;
    font-family: 'Rajdhani', 'Segoe UI', -apple-system, sans-serif;
  }

  #mainContainer {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    position: relative;
    cursor: pointer;
  }

  /* Ambient radial background glow behind eyes */
  .ambient-glow {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.24) 0%, rgba(220, 38, 38, 0.08) 45%, rgba(0, 0, 0, 0) 75%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    animation: ambientBreathe 4.5s ease-in-out infinite alternate;
  }

  /* VECTOR HEADLIGHTS / EYES SECTION */
  .eyes-wrapper {
    position: relative;
    width: 94%;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 26px;
    margin-top: -12px;
    filter: drop-shadow(0 0 12px rgba(255, 30, 30, 0.85)) drop-shadow(0 0 28px rgba(239, 68, 68, 0.5));
    animation: eyeLivingPulse 4.2s ease-in-out infinite alternate;
    transform-origin: 50% 55%;
    transition: filter 0.3s ease;
  }

  .eyes-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Active speaking flare on headlights */
  .eyes-wrapper.speaking {
    animation: eyeSpeakingFlare 0.95s ease-in-out infinite alternate !important;
  }

  /* Cyber blink / predatory squint reflex */
  .eyes-wrapper.blink {
    animation: eyeReflexSquint 0.22s cubic-bezier(0.25, 0.1, 0.25, 1) forwards !important;
  }

  @keyframes eyeReflexSquint {
    0% { transform: scaleY(1) scaleX(1); }
    40% { transform: scaleY(0.08) scaleX(1.03); filter: drop-shadow(0 0 18px rgba(255, 40, 40, 1.0)); }
    75% { transform: scaleY(1.06) scaleX(0.99); }
    100% { transform: scaleY(1) scaleX(1); }
  }

  @keyframes eyeLivingPulse {
    0% {
      filter: drop-shadow(0 0 10px rgba(255, 20, 20, 0.75)) drop-shadow(0 0 22px rgba(220, 38, 38, 0.45));
      transform: scale(0.992) rotate(0deg);
      opacity: 0.95;
    }
    50% {
      filter: drop-shadow(0 0 16px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 36px rgba(239, 68, 68, 0.7));
      transform: scale(1.012) rotate(0.2deg);
      opacity: 1.0;
    }
    100% {
      filter: drop-shadow(0 0 11px rgba(255, 20, 20, 0.78)) drop-shadow(0 0 24px rgba(220, 38, 38, 0.48));
      transform: scale(0.995) rotate(-0.2deg);
      opacity: 0.96;
    }
  }

  @keyframes eyeSpeakingFlare {
    0% {
      filter: drop-shadow(0 0 18px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 42px rgba(255, 0, 0, 0.8));
      transform: scale(1.01);
    }
    100% {
      filter: drop-shadow(0 0 32px rgba(255, 60, 60, 1.0)) drop-shadow(0 0 65px rgba(255, 10, 10, 0.95));
      transform: scale(1.038);
    }
  }

  @keyframes ambientBreathe {
    0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* TYPOGRAPHY SECTION */
  .title-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 0px;
  }

  .title-jarvis {
    font-family: 'Orbitron', 'Rajdhani', sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 13px;
    color: #F8FAFC;
    text-transform: uppercase;
    text-indent: 13px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 0 0 24px rgba(239, 68, 68, 0.5);
    margin-bottom: 7px;
  }

  .subtitle-jarvis {
    font-family: 'Rajdhani', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #8E95A5;
    text-transform: uppercase;
    text-indent: 5px;
    opacity: 0.85;
  }

  /* SLEEK AUDIO FREQUENCY FILAMENT WAVEFORM & LASER HORIZON */
  .wave-container {
    position: relative;
    width: 100%;
    max-width: 360px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-top: 20px;
    margin-bottom: 6px;
    background: transparent !important;
    border: none !important;
  }

  #waveformCanvas {
    width: 360px;
    height: 76px;
    display: block;
    background: transparent !important;
  }

  /* LATEST RESPONSE SECTION (Matching user reference) */
  .response-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 330px;
    min-height: 56px;
    z-index: 1;
    margin-top: 4px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .response-heading {
    font-family: 'Rajdhani', -apple-system, sans-serif;
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: #FFFFFF;
    margin-bottom: 4px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
  }

  .response-body {
    font-family: 'Rajdhani', -apple-system, sans-serif;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: 0.35px;
    color: #94A3B8;
    line-height: 1.35;
    max-height: 52px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
</style>
</head>
<body>

<div id="mainContainer">
  <!-- Subtle red backlight halo behind eyes -->
  <div class="ambient-glow"></div>

  <!-- PURE PROCEDURAL VECTOR HEADLIGHTS / EYES -->
  <div class="eyes-wrapper" id="eyesWrapper">
    <svg class="eyes-svg" id="eyesSvg" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Neon Glow Filter -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur2" />
          <feGaussianBlur stdDeviation="2.2" result="blur1" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Gradients -->
        <linearGradient id="browGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#EF4444" stop-opacity="0.2" />
          <stop offset="15%" stop-color="#EF4444" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#FF5252" />
          <stop offset="85%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FF3B30" stop-opacity="0.1" />
        </linearGradient>

        <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF5A50" />
          <stop offset="45%" stop-color="#EF4444" />
          <stop offset="100%" stop-color="#DC2626" />
        </linearGradient>

        <linearGradient id="hotCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="70%" stop-color="#FFAAAA" />
          <stop offset="100%" stop-color="#FF3333" />
        </linearGradient>

        <!-- Left Headlight Assembly -->
        <g id="singleHeadlight">
          <!-- Outer Ambient Glow Underlays -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="#FF1111" stroke-width="12" opacity="0.4" filter="url(#neonGlow)" />
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />

          <!-- Outer Projector Bracket Base Neon Tube -->
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Outer Projector Bracket Inner Hot Core -->
          <path d="M 96,55 L 87,84 L 106,111 L 145,111 L 159,96 L 154,65" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Inner Projector Bracket Base Neon Tube -->
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Inner Projector Bracket Inner Hot Core -->
          <path d="M 174,69 L 167,96 L 180,118 L 219,118 L 235,102 L 230,77" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Main Top DRL Eyebrow Base -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="url(#bracketGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Main Top DRL Eyebrow Hot Core -->
          <path d="M 48,35 Q 70,42 95,49 L 260,82 L 298,87" fill="none" stroke="url(#hotCoreGrad)" stroke-width="2.6" stroke-linecap="round" />

          <!-- Aero Whisker / Speed Slashes -->
          <path d="M 52,22 L 115,44" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.65" stroke-linecap="round" />
          <path d="M 68,98 L 84,124" fill="none" stroke="#FF3333" stroke-width="2.0" opacity="0.75" stroke-linecap="round" />
          <path d="M 104,120 L 126,128" fill="none" stroke="#FF2222" stroke-width="1.6" opacity="0.6" stroke-linecap="round" />
          <path d="M 226,118 L 265,124" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.7" stroke-linecap="round" />
          <path d="M 235,125 L 258,129" fill="none" stroke="#FF2222" stroke-width="1.4" opacity="0.5" stroke-linecap="round" />

          <!-- ALIVE PROJECTOR OPTIC PUPIL CORES -->
          <!-- Outer Projector Pupil -->
          <g class="eye-pupil outer-pupil" id="outerPupilGroup">
            <circle cx="122" cy="85" r="14" fill="rgba(255, 30, 30, 0.12)" />
            <polygon points="122,76 130,81 130,89 122,94 114,89 114,81" fill="none" stroke="#FF4444" stroke-width="1.5" opacity="0.85" />
            <circle cx="122" cy="85" r="3.8" fill="#FF1E1E" filter="url(#neonGlow)" />
            <circle cx="122" cy="85" r="2.0" fill="#FFFFFF" />
          </g>

          <!-- Inner Projector Pupil -->
          <g class="eye-pupil inner-pupil" id="innerPupilGroup">
            <circle cx="201" cy="94" r="14" fill="rgba(255, 30, 30, 0.12)" />
            <polygon points="201,85 209,90 209,98 201,103 193,98 193,90" fill="none" stroke="#FF4444" stroke-width="1.5" opacity="0.85" />
            <circle cx="201" cy="94" r="3.8" fill="#FF1E1E" filter="url(#neonGlow)" />
            <circle cx="201" cy="94" r="2.0" fill="#FFFFFF" />
          </g>
        </g>
      </defs>

      <!-- LEFT HEADLIGHT -->
      <g id="leftEyeGroup">
        <use href="#singleHeadlight" />
      </g>

      <!-- RIGHT HEADLIGHT (Mirrored across center X=340) -->
      <g id="rightEyeGroup" transform="translate(680, 0) scale(-1, 1)">
        <use href="#singleHeadlight" />
      </g>
    </svg>
  </div>

  <!-- TITLE & SUBTITLE -->
  <div class="title-section">
    <div class="title-jarvis">J&#923;RVIS</div>
    <div class="subtitle-jarvis">YOUR PERSONAL AI ASSISTANT</div>
  </div>

  <!-- REAL-TIME REACTIVE AUDIO FREQUENCY WAVEFORM (MATCHING REFERENCE EXACTLY) -->
  <div class="wave-container">
    <canvas id="waveformCanvas" width="360" height="76"></canvas>
  </div>

  <!-- LATEST RESPONSE / GREETING TEXT (MATCHING REFERENCE EXACTLY) -->
  <div class="response-section" id="responseSection">
    <div class="response-heading" id="responseHeading">Hello Sir.</div>
    <div class="response-body" id="responseBody">How can I help you today?</div>
  </div>
</div>

<script>
  // Elements
  const eyesWrapper = document.getElementById('eyesWrapper');
  const canvas = document.getElementById('waveformCanvas');
  const ctx = canvas.getContext('2d');
  const mainContainer = document.getElementById('mainContainer');
  const outerPupils = document.querySelectorAll('.outer-pupil');
  const innerPupils = document.querySelectorAll('.inner-pupil');
  const responseSection = document.getElementById('responseSection');
  const responseHeading = document.getElementById('responseHeading');
  const responseBody = document.getElementById('responseBody');

  // Interactive tap triggers assistant
  mainContainer.addEventListener('click', () => {
    if (window.AndroidInterface && window.AndroidInterface.onOrbClicked) {
      window.AndroidInterface.onOrbClicked();
    }
  });

  // State
  let currentAmplitude = 0.0;
  let targetAmplitude = 0.0;
  let isSpeaking = false;
  let time = 0;

  // Eye Saccades (Autonomous Micro-Glances)
  let pupilTargetX = 0;
  let pupilTargetY = 0;
  let pupilCurrentX = 0;
  let pupilCurrentY = 0;

  function scheduleNextGlance() {
    const delay = 1600 + Math.random() * 2600;
    setTimeout(() => {
      // Natural subtle eye saccade: look slightly left, right, or center
      pupilTargetX = (Math.random() - 0.5) * 5.0;
      pupilTargetY = (Math.random() - 0.5) * 2.5;
      scheduleNextGlance();
    }, delay);
  }
  scheduleNextGlance();

  // Autonomous Natural Blinking
  function scheduleNextBlink() {
    const delay = 3800 + Math.random() * 3500;
    setTimeout(() => {
      eyesWrapper.classList.add('blink');
      setTimeout(() => {
        eyesWrapper.classList.remove('blink');
        scheduleNextBlink();
      }, 230);
    }, delay);
  }
  scheduleNextBlink();

  // Waveform Bar Configuration (Center Gaussian Audio Spectrum)
  const BAR_COUNT = 65; // odd number for centered apex bar
  const BAR_WIDTH = 1.8;
  const GAP = 2.4;

  function renderWaveform() {
    time += 0.035;
    // Smooth dampening towards target amplitude
    currentAmplitude += (targetAmplitude - currentAmplitude) * 0.20;

    // Pupil micro-saccades interpolation
    pupilCurrentX += (pupilTargetX - pupilCurrentX) * 0.10;
    pupilCurrentY += (pupilTargetY - pupilCurrentY) * 0.10;

    // Apply micro-saccade offset to pupils
    const pupilTransform = `translate(${pupilCurrentX.toFixed(2)}px, ${pupilCurrentY.toFixed(2)}px)`;
    outerPupils.forEach(el => el.style.transform = pupilTransform);
    innerPupils.forEach(el => el.style.transform = pupilTransform);

    const w = canvas.width;
    const h = canvas.height;
    const centerY = h / 2;
    const centerX = w / 2;

    ctx.clearRect(0, 0, w, h);

    // 1. Center Atmospheric Crimson Bloom
    const bloom = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 82);
    const bloomAlpha = isSpeaking ? 0.38 : (0.24 + currentAmplitude * 0.22);
    bloom.addColorStop(0, `rgba(255, 20, 20, ${bloomAlpha})`);
    bloom.addColorStop(0.5, 'rgba(220, 0, 0, 0.08)');
    bloom.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, w, h);

    // 2. Glowing Horizontal Laser Baseline (Full span across, smooth edge fade)
    ctx.save();
    const lineGrad = ctx.createLinearGradient(0, centerY, w, centerY);
    lineGrad.addColorStop(0, 'rgba(255, 20, 20, 0)');
    lineGrad.addColorStop(0.12, 'rgba(255, 30, 30, 0.45)');
    lineGrad.addColorStop(0.42, 'rgba(255, 45, 45, 0.95)');
    lineGrad.addColorStop(0.5, 'rgba(255, 235, 235, 1.0)');
    lineGrad.addColorStop(0.58, 'rgba(255, 45, 45, 0.95)');
    lineGrad.addColorStop(0.88, 'rgba(255, 30, 30, 0.45)');
    lineGrad.addColorStop(1, 'rgba(255, 20, 20, 0)');

    // Line red glow pass
    ctx.strokeStyle = 'rgba(255, 20, 20, 0.55)';
    ctx.shadowColor = '#FF0015';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(10, centerY);
    ctx.lineTo(w - 10, centerY);
    ctx.stroke();

    // Line crisp laser core
    ctx.strokeStyle = lineGrad;
    ctx.shadowBlur = 4;
    ctx.shadowColor = '#FF4444';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(10, centerY);
    ctx.lineTo(w - 10, centerY);
    ctx.stroke();
    ctx.restore();

    // 3. Dense Vertical Filaments / Audio Spectrum (Symmetrical Gaussian)
    const totalBarsWidth = BAR_COUNT * (BAR_WIDTH + GAP);
    const startX = (w - totalBarsWidth) / 2;
    const centerIdx = Math.floor(BAR_COUNT / 2);

    for (let i = 0; i < BAR_COUNT; i++) {
      const distFromCenter = Math.abs(i - centerIdx) / centerIdx; // 0 to 1
      // Gaussian distribution envelope
      const gaussian = Math.exp(-Math.pow(distFromCenter * 2.7, 2));

      // Organic harmonic wave ripple across filaments
      const ripple1 = Math.sin(time * 2.6 + i * 0.28);
      const ripple2 = Math.cos(time * 1.9 - i * 0.35);
      const harmonic = (ripple1 * 0.6 + ripple2 * 0.4);

      // Base idle height: subtle breathing wave
      const idleWave = (0.82 + harmonic * 0.18);
      const idleH = 26.0 * gaussian * idleWave;

      // Active speech audio height
      const speechWave = Math.sin(time * 6.5 + i * 0.45);
      const activeH = (currentAmplitude * 32.0 + speechWave * currentAmplitude * 18.0) * gaussian;

      const halfHeight = Math.max(0.8, idleH + (isSpeaking || currentAmplitude > 0.03 ? activeH : 0));
      const x = startX + i * (BAR_WIDTH + GAP);

      ctx.save();
      // Glow pass
      ctx.shadowColor = '#FF0000';
      ctx.shadowBlur = 8 * gaussian;

      // Vertical filament gradient with bright core at baseline
      const barGrad = ctx.createLinearGradient(x, centerY - halfHeight, x, centerY + halfHeight);
      barGrad.addColorStop(0, 'rgba(255, 45, 45, 0.9)');
      barGrad.addColorStop(0.3, 'rgba(235, 15, 15, 0.95)');
      if (distFromCenter < 0.35) {
        barGrad.addColorStop(0.5, 'rgba(255, 235, 235, 1.0)');
      } else {
        barGrad.addColorStop(0.5, 'rgba(255, 110, 110, 0.95)');
      }
      barGrad.addColorStop(0.7, 'rgba(235, 15, 15, 0.95)');
      barGrad.addColorStop(1, 'rgba(255, 45, 45, 0.9)');

      ctx.fillStyle = barGrad;
      ctx.fillRect(x, centerY - halfHeight, BAR_WIDTH, halfHeight * 2);
      ctx.restore();
    }

    requestAnimationFrame(renderWaveform);
  }

  requestAnimationFrame(renderWaveform);

  // External Native Android Hooks
  window.setAudioAmplitude = function(rms) {
    const val = Math.min(1.0, Math.max(0.0, rms));
    targetAmplitude = val;
  };

  window.setOrbState = function(stateName) {
    if (stateName === 'SPEAKING') {
      isSpeaking = true;
      eyesWrapper.classList.add('speaking');
    } else {
      isSpeaking = false;
      eyesWrapper.classList.remove('speaking');
      if (stateName === 'IDLE') {
        targetAmplitude = 0.0;
      }
    }
  };

  // Live response text updater
  window.setLatestResponse = function(text) {
    if (!text || !text.trim()) return;

    responseSection.style.opacity = '0';
    responseSection.style.transform = 'translateY(4px)';

    setTimeout(() => {
      const clean = text.trim();
      const periodIdx = clean.indexOf('.');
      const questionIdx = clean.indexOf('?');
      const exclamationIdx = clean.indexOf('!');
      let firstBreak = -1;

      const candidates = [periodIdx, questionIdx, exclamationIdx].filter(idx => idx > 0);
      if (candidates.length > 0) {
        firstBreak = Math.min(...candidates);
      }

      if (firstBreak > 0 && firstBreak < 36 && clean.length > firstBreak + 2) {
        responseHeading.textContent = clean.substring(0, firstBreak + 1);
        responseBody.textContent = clean.substring(firstBreak + 1).trim();
      } else if (clean.length <= 32) {
        responseHeading.textContent = clean;
        responseBody.textContent = "";
      } else {
        responseHeading.textContent = "JARVIS";
        responseBody.textContent = clean;
      }

      responseSection.style.opacity = '1';
      responseSection.style.transform = 'translateY(0)';
    }, 200);
  };
</script>

</body>
</html>
