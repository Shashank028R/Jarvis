<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS Blaze Red Core</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000 !important;
    background: #000000 !important;
    overflow: hidden;
    font-family: 'Rajdhani', 'Segoe UI', -apple-system, sans-serif;
  }

  #mainContainer {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    position: relative;
    cursor: pointer;
  }

  /* Ambient radial background glow behind eyes */
  .ambient-glow {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    height: 190px;
    background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.22) 0%, rgba(220, 38, 38, 0.08) 45%, rgba(0, 0, 0, 0) 75%);
    filter: blur(28px);
    pointer-events: none;
    z-index: 0;
    animation: ambientBreathe 4s ease-in-out infinite alternate;
  }

  /* VECTOR HEADLIGHTS / EYES SECTION */
  .eyes-wrapper {
    position: relative;
    width: 94%;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 28px;
    margin-top: -10px;
    filter: drop-shadow(0 0 12px rgba(255, 30, 30, 0.85)) drop-shadow(0 0 28px rgba(239, 68, 68, 0.5));
    animation: eyePulse 4s ease-in-out infinite alternate;
    transition: filter 0.3s ease, transform 0.3s ease;
  }

  .eyes-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Active speaking flare on headlights */
  .eyes-wrapper.speaking {
    animation: eyeSpeakingFlare 1.1s ease-in-out infinite alternate !important;
  }

  @keyframes eyePulse {
    0% {
      filter: drop-shadow(0 0 10px rgba(255, 20, 20, 0.75)) drop-shadow(0 0 22px rgba(220, 38, 38, 0.45));
      transform: scale(0.99);
      opacity: 0.95;
    }
    50% {
      filter: drop-shadow(0 0 16px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 36px rgba(239, 68, 68, 0.7));
      transform: scale(1.015);
      opacity: 1.0;
    }
    100% {
      filter: drop-shadow(0 0 10px rgba(255, 20, 20, 0.75)) drop-shadow(0 0 22px rgba(220, 38, 38, 0.45));
      transform: scale(0.99);
      opacity: 0.95;
    }
  }

  @keyframes eyeSpeakingFlare {
    0% {
      filter: drop-shadow(0 0 18px rgba(255, 40, 40, 0.9)) drop-shadow(0 0 40px rgba(255, 0, 0, 0.75));
      transform: scale(1.01);
    }
    100% {
      filter: drop-shadow(0 0 28px rgba(255, 60, 60, 1.0)) drop-shadow(0 0 60px rgba(255, 10, 10, 0.95));
      transform: scale(1.035);
    }
  }

  @keyframes ambientBreathe {
    0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* TYPOGRAPHY SECTION */
  .title-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 24px;
  }

  .title-jarvis {
    font-family: 'Orbitron', 'Rajdhani', sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 13px;
    color: #F8FAFC;
    text-transform: uppercase;
    text-indent: 13px; /* balance letter-spacing visually */
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 0 0 24px rgba(239, 68, 68, 0.5);
    margin-bottom: 7px;
  }

  .subtitle-jarvis {
    font-family: 'Rajdhani', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #8E95A5;
    text-transform: uppercase;
    text-indent: 5px;
    opacity: 0.85;
  }

  /* ADVANCED CENTER AUDIO REACTOR */
  .wave-container {
    position: relative;
    width: 220px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-top: 4px;
  }

  #waveformCanvas {
    width: 220px;
    height: 54px;
    display: block;
    filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5));
  }
</style>
</head>
<body>

<div id="mainContainer">
  <!-- Subtle red backlight halo behind eyes -->
  <div class="ambient-glow"></div>

  <!-- PURE PROCEDURAL VECTOR HEADLIGHTS / EYES -->
  <div class="eyes-wrapper" id="eyesWrapper">
    <svg class="eyes-svg" id="eyesSvg" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Neon Glow Filter -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur2" />
          <feGaussianBlur stdDeviation="2.2" result="blur1" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Gradients -->
        <linearGradient id="browGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#EF4444" stop-opacity="0.2" />
          <stop offset="15%" stop-color="#EF4444" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#FF5252" />
          <stop offset="85%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FF3B30" stop-opacity="0.1" />
        </linearGradient>

        <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF5A50" />
          <stop offset="45%" stop-color="#EF4444" />
          <stop offset="100%" stop-color="#DC2626" />
        </linearGradient>

        <linearGradient id="hotCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="70%" stop-color="#FFAAAA" />
          <stop offset="100%" stop-color="#FF3333" />
        </linearGradient>

        <!-- Left Headlight Assembly -->
        <g id="singleHeadlight">
          <!-- Outer Ambient Glow Underlays -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="#FF1111" stroke-width="12" opacity="0.4" filter="url(#neonGlow)" />
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />

          <!-- Outer Projector Bracket Base Neon Tube -->
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Outer Projector Bracket Inner Hot Core -->
          <path d="M 96,55 L 87,84 L 106,111 L 145,111 L 159,96 L 154,65" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Inner Projector Bracket Base Neon Tube -->
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Inner Projector Bracket Inner Hot Core -->
          <path d="M 174,69 L 167,96 L 180,118 L 219,118 L 235,102 L 230,77" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Main Top DRL Eyebrow Base -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="url(#bracketGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Main Top DRL Eyebrow Hot Core -->
          <path d="M 48,35 Q 70,42 95,49 L 260,82 L 298,87" fill="none" stroke="url(#hotCoreGrad)" stroke-width="2.6" stroke-linecap="round" />

          <!-- Aero Whisker / Speed Slashes -->
          <path d="M 52,22 L 115,44" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.65" stroke-linecap="round" />
          <path d="M 68,98 L 84,124" fill="none" stroke="#FF3333" stroke-width="2.0" opacity="0.75" stroke-linecap="round" />
          <path d="M 104,120 L 126,128" fill="none" stroke="#FF2222" stroke-width="1.6" opacity="0.6" stroke-linecap="round" />
          <path d="M 226,118 L 265,124" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.7" stroke-linecap="round" />
          <path d="M 235,125 L 258,129" fill="none" stroke="#FF2222" stroke-width="1.4" opacity="0.5" stroke-linecap="round" />
        </g>
      </defs>

      <!-- LEFT HEADLIGHT -->
      <use href="#singleHeadlight" />

      <!-- RIGHT HEADLIGHT (Mirrored across center X=340) -->
      <use href="#singleHeadlight" transform="translate(680, 0) scale(-1, 1)" />
    </svg>
  </div>

  <!-- TITLE & SUBTITLE -->
  <div class="title-section">
    <div class="title-jarvis">J&#923;RVIS</div>
    <div class="subtitle-jarvis">YOUR PERSONAL AI ASSISTANT</div>
  </div>

  <!-- ADVANCED CENTER AUDIO EQUALIZER & REACTOR -->
  <div class="wave-container">
    <canvas id="waveformCanvas" width="220" height="54"></canvas>
  </div>
</div>

<script>
  // Elements
  const eyesWrapper = document.getElementById('eyesWrapper');
  const canvas = document.getElementById('waveformCanvas');
  const ctx = canvas.getContext('2d');
  const mainContainer = document.getElementById('mainContainer');

  // Interactive tap triggers assistant
  mainContainer.addEventListener('click', () => {
    if (window.AndroidInterface && window.AndroidInterface.onOrbClicked) {
      window.AndroidInterface.onOrbClicked();
    }
  });

  // State
  let currentAmplitude = 0.0;
  let targetAmplitude = 0.0;
  let isSpeaking = false;
  let time = 0;

  // Equalizer Configuration (Compact, Center-Only)
  const BAR_COUNT = 21; // Odd number for centered symmetry
  const BAR_WIDTH = 2.4;
  const BAR_GAP = 3.6;
  const PEAK_GRAVITY = 0.55;
  const peaks = new Array(BAR_COUNT).fill(0);

  function renderWaveform() {
    time += 0.05;
    // Smooth dampening towards target amplitude
    currentAmplitude += (targetAmplitude - currentAmplitude) * 0.22;

    const width = canvas.width;
    const height = canvas.height;
    const centerY = height / 2;

    ctx.clearRect(0, 0, width, height);

    // 1. Holographic Flanking Cyber Brackets [ <   > ]
    const bracketColor = isSpeaking ? 'rgba(255, 70, 70, 0.95)' : 'rgba(239, 68, 68, 0.65)';
    ctx.strokeStyle = bracketColor;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Left Bracket [ <
    ctx.beginPath();
    ctx.moveTo(20, centerY - 14);
    ctx.lineTo(12, centerY - 14);
    ctx.lineTo(12, centerY + 14);
    ctx.lineTo(20, centerY + 14);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(22, centerY - 7);
    ctx.lineTo(17, centerY);
    ctx.lineTo(22, centerY + 7);
    ctx.stroke();

    // Right Bracket > ]
    ctx.beginPath();
    ctx.moveTo(width - 20, centerY - 14);
    ctx.lineTo(width - 12, centerY - 14);
    ctx.lineTo(width - 12, centerY + 14);
    ctx.lineTo(width - 20, centerY + 14);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(width - 22, centerY - 7);
    ctx.lineTo(width - 17, centerY);
    ctx.lineTo(width - 22, centerY + 7);
    ctx.stroke();

    // 2. Central Laser Baseline
    const laserGrad = ctx.createLinearGradient(30, centerY, width - 30, centerY);
    laserGrad.addColorStop(0, 'rgba(239, 68, 68, 0)');
    laserGrad.addColorStop(0.2, 'rgba(239, 68, 68, 0.4)');
    laserGrad.addColorStop(0.5, isSpeaking ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 70, 70, 0.8)');
    laserGrad.addColorStop(0.8, 'rgba(239, 68, 68, 0.4)');
    laserGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');

    ctx.strokeStyle = laserGrad;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(30, centerY);
    ctx.lineTo(width - 30, centerY);
    ctx.stroke();

    // 3. Dynamic Center Frequency Spectrum Bars with Peak-Hold Decay
    const totalSpectrumWidth = BAR_COUNT * (BAR_WIDTH + BAR_GAP) - BAR_GAP;
    const startX = (width - totalSpectrumWidth) / 2;
    const centerIdx = Math.floor(BAR_COUNT / 2);

    for (let i = 0; i < BAR_COUNT; i++) {
      const dist = Math.abs(i - centerIdx) / centerIdx; // 0 at center, 1 at edges
      // Parabolic audio distribution envelope
      const envelope = Math.max(0.2, Math.cos(dist * Math.PI * 0.45));

      // Symmetrical multi-harmonic oscillation
      const h1 = Math.sin(time * 3.2 + i * 0.42);
      const h2 = Math.cos(time * 4.6 - i * 0.3);
      const harmonic = (h1 * 0.55 + h2 * 0.45);

      // Idle breathing vs active speech response
      const idleH = (2.0 + Math.sin(time * 2.0 + i * 0.28) * 1.5) * envelope;
      const speechPower = (isSpeaking || currentAmplitude > 0.03) ? currentAmplitude : 0;
      const activeH = (speechPower * 20.0 + (harmonic * speechPower * 14.0)) * envelope;

      const halfHeight = Math.max(1.5, Math.min(22.0, idleH + activeH));

      // Peak-hold calculation
      if (halfHeight > peaks[i]) {
        peaks[i] = halfHeight;
      } else {
        peaks[i] = Math.max(halfHeight, peaks[i] - PEAK_GRAVITY);
      }

      const x = startX + i * (BAR_WIDTH + BAR_GAP);

      // Gradient for each bar
      const barGrad = ctx.createLinearGradient(x, centerY - halfHeight, x, centerY + halfHeight);
      barGrad.addColorStop(0, '#FFAAAA');
      barGrad.addColorStop(0.3, '#FF3B30');
      barGrad.addColorStop(0.5, '#FFFFFF');
      barGrad.addColorStop(0.7, '#FF3B30');
      barGrad.addColorStop(1, '#DC2626');

      ctx.fillStyle = barGrad;
      ctx.fillRect(x, centerY - halfHeight, BAR_WIDTH, halfHeight * 2);

      // Peak Hold Cap Dot
      const peakY1 = centerY - peaks[i] - 1.8;
      const peakY2 = centerY + peaks[i] + 0.6;
      ctx.fillStyle = isSpeaking ? '#FFFFFF' : '#FF7070';
      ctx.fillRect(x, peakY1, BAR_WIDTH, 1.2);
      ctx.fillRect(x, peakY2, BAR_WIDTH, 1.2);
    }

    requestAnimationFrame(renderWaveform);
  }

  requestAnimationFrame(renderWaveform);

  // External Native Android Hooks
  window.setAudioAmplitude = function(rms) {
    const val = Math.min(1.0, Math.max(0.0, rms));
    targetAmplitude = val;
  };

  window.setOrbState = function(stateName) {
    if (stateName === 'SPEAKING') {
      isSpeaking = true;
      eyesWrapper.classList.add('speaking');
    } else {
      isSpeaking = false;
      eyesWrapper.classList.remove('speaking');
      if (stateName === 'IDLE') {
        targetAmplitude = 0.0;
      }
    }
  };

  // Keep stub for backwards compatibility with native calls
  window.setLatestResponse = function(text) {};
</script>

</body>
</html>
