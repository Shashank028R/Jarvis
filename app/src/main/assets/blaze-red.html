<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS Blaze Red Core</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000 !important;
    background: #000000 !important;
    overflow: hidden;
    font-family: 'Rajdhani', 'Segoe UI', -apple-system, sans-serif;
  }

  #mainContainer {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    position: relative;
    cursor: pointer;
  }

  /* Ambient radial background glow behind eyes */
  .ambient-glow {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.24) 0%, rgba(220, 38, 38, 0.08) 45%, rgba(0, 0, 0, 0) 75%);
    filter: blur(30px);
    pointer-events: none;
    z-index: 0;
    animation: ambientBreathe 4.5s ease-in-out infinite alternate;
  }

  /* VECTOR HEADLIGHTS / EYES SECTION */
  .eyes-wrapper {
    position: relative;
    width: 94%;
    max-width: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 26px;
    margin-top: -12px;
    filter: drop-shadow(0 0 12px rgba(255, 30, 30, 0.85)) drop-shadow(0 0 28px rgba(239, 68, 68, 0.5));
    animation: eyeLivingPulse 4.2s ease-in-out infinite alternate;
    transform-origin: 50% 55%;
    transition: filter 0.3s ease;
  }

  .eyes-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Active speaking flare on headlights */
  .eyes-wrapper.speaking {
    animation: eyeSpeakingFlare 0.95s ease-in-out infinite alternate !important;
  }

  /* Cyber blink / predatory squint reflex */
  .eyes-wrapper.blink {
    animation: eyeReflexSquint 0.22s cubic-bezier(0.25, 0.1, 0.25, 1) forwards !important;
  }

  @keyframes eyeReflexSquint {
    0% { transform: scaleY(1) scaleX(1); }
    40% { transform: scaleY(0.08) scaleX(1.03); filter: drop-shadow(0 0 18px rgba(255, 40, 40, 1.0)); }
    75% { transform: scaleY(1.06) scaleX(0.99); }
    100% { transform: scaleY(1) scaleX(1); }
  }

  @keyframes eyeLivingPulse {
    0% {
      filter: drop-shadow(0 0 10px rgba(255, 20, 20, 0.75)) drop-shadow(0 0 22px rgba(220, 38, 38, 0.45));
      transform: scale(0.992) rotate(0deg);
      opacity: 0.95;
    }
    50% {
      filter: drop-shadow(0 0 16px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 36px rgba(239, 68, 68, 0.7));
      transform: scale(1.012) rotate(0.2deg);
      opacity: 1.0;
    }
    100% {
      filter: drop-shadow(0 0 11px rgba(255, 20, 20, 0.78)) drop-shadow(0 0 24px rgba(220, 38, 38, 0.48));
      transform: scale(0.995) rotate(-0.2deg);
      opacity: 0.96;
    }
  }

  @keyframes eyeSpeakingFlare {
    0% {
      filter: drop-shadow(0 0 18px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 42px rgba(255, 0, 0, 0.8));
      transform: scale(1.01);
    }
    100% {
      filter: drop-shadow(0 0 32px rgba(255, 60, 60, 1.0)) drop-shadow(0 0 65px rgba(255, 10, 10, 0.95));
      transform: scale(1.038);
    }
  }

  @keyframes ambientBreathe {
    0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1.0; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* TYPOGRAPHY SECTION */
  .title-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-bottom: 0px;
  }

  .title-jarvis {
    font-family: 'Orbitron', 'Rajdhani', sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 13px;
    color: #F8FAFC;
    text-transform: uppercase;
    text-indent: 13px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4), 0 0 24px rgba(239, 68, 68, 0.5);
    margin-bottom: 7px;
  }

  .subtitle-jarvis {
    font-family: 'Rajdhani', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 5px;
    color: #8E95A5;
    text-transform: uppercase;
    text-indent: 5px;
    opacity: 0.85;
  }

  /* SLEEK CENTER HEARTBEAT WAVEFORM (Shifted lower, zero container/borders) */
  .wave-container {
    position: relative;
    width: 280px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    margin-top: 48px; /* shifted lower towards bottom */
    background: transparent !important;
    border: none !important;
  }

  #waveformCanvas {
    width: 280px;
    height: 54px;
    display: block;
    background: transparent !important;
  }
</style>
</head>
<body>

<div id="mainContainer">
  <!-- Subtle red backlight halo behind eyes -->
  <div class="ambient-glow"></div>

  <!-- PURE PROCEDURAL VECTOR HEADLIGHTS / EYES -->
  <div class="eyes-wrapper" id="eyesWrapper">
    <svg class="eyes-svg" id="eyesSvg" viewBox="0 0 680 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Neon Glow Filter -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur2" />
          <feGaussianBlur stdDeviation="2.2" result="blur1" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Gradients -->
        <linearGradient id="browGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#EF4444" stop-opacity="0.2" />
          <stop offset="15%" stop-color="#EF4444" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#FF5252" />
          <stop offset="85%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FF3B30" stop-opacity="0.1" />
        </linearGradient>

        <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FF5A50" />
          <stop offset="45%" stop-color="#EF4444" />
          <stop offset="100%" stop-color="#DC2626" />
        </linearGradient>

        <linearGradient id="hotCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="70%" stop-color="#FFAAAA" />
          <stop offset="100%" stop-color="#FF3333" />
        </linearGradient>

        <!-- Left Headlight Assembly -->
        <g id="singleHeadlight">
          <!-- Outer Ambient Glow Underlays -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="#FF1111" stroke-width="12" opacity="0.4" filter="url(#neonGlow)" />
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="#FF0000" stroke-width="13" opacity="0.32" filter="url(#neonGlow)" />

          <!-- Outer Projector Bracket Base Neon Tube -->
          <path d="M 96,54 L 86,84 L 106,112 L 146,112 L 160,96 L 154,64" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Outer Projector Bracket Inner Hot Core -->
          <path d="M 96,55 L 87,84 L 106,111 L 145,111 L 159,96 L 154,65" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Inner Projector Bracket Base Neon Tube -->
          <path d="M 174,68 L 166,96 L 180,119 L 220,119 L 236,102 L 230,76" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Inner Projector Bracket Inner Hot Core -->
          <path d="M 174,69 L 167,96 L 180,118 L 219,118 L 235,102 L 230,77" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Main Top DRL Eyebrow Base -->
          <path d="M 38,32 Q 65,40 95,49 L 260,82 L 305,88" fill="none" stroke="url(#bracketGrad)" stroke-width="7" stroke-linecap="round" />
          <!-- Main Top DRL Eyebrow Hot Core -->
          <path d="M 48,35 Q 70,42 95,49 L 260,82 L 298,87" fill="none" stroke="url(#hotCoreGrad)" stroke-width="2.6" stroke-linecap="round" />

          <!-- Aero Whisker / Speed Slashes -->
          <path d="M 52,22 L 115,44" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.65" stroke-linecap="round" />
          <path d="M 68,98 L 84,124" fill="none" stroke="#FF3333" stroke-width="2.0" opacity="0.75" stroke-linecap="round" />
          <path d="M 104,120 L 126,128" fill="none" stroke="#FF2222" stroke-width="1.6" opacity="0.6" stroke-linecap="round" />
          <path d="M 226,118 L 265,124" fill="none" stroke="#FF3333" stroke-width="1.8" opacity="0.7" stroke-linecap="round" />
          <path d="M 235,125 L 258,129" fill="none" stroke="#FF2222" stroke-width="1.4" opacity="0.5" stroke-linecap="round" />

          <!-- ALIVE PROJECTOR OPTIC PUPIL CORES -->
          <!-- Outer Projector Pupil -->
          <g class="eye-pupil outer-pupil" id="outerPupilGroup">
            <circle cx="122" cy="85" r="14" fill="rgba(255, 30, 30, 0.12)" />
            <polygon points="122,76 130,81 130,89 122,94 114,89 114,81" fill="none" stroke="#FF4444" stroke-width="1.5" opacity="0.85" />
            <circle cx="122" cy="85" r="3.8" fill="#FF1E1E" filter="url(#neonGlow)" />
            <circle cx="122" cy="85" r="2.0" fill="#FFFFFF" />
          </g>

          <!-- Inner Projector Pupil -->
          <g class="eye-pupil inner-pupil" id="innerPupilGroup">
            <circle cx="201" cy="94" r="14" fill="rgba(255, 30, 30, 0.12)" />
            <polygon points="201,85 209,90 209,98 201,103 193,98 193,90" fill="none" stroke="#FF4444" stroke-width="1.5" opacity="0.85" />
            <circle cx="201" cy="94" r="3.8" fill="#FF1E1E" filter="url(#neonGlow)" />
            <circle cx="201" cy="94" r="2.0" fill="#FFFFFF" />
          </g>
        </g>
      </defs>

      <!-- LEFT HEADLIGHT -->
      <g id="leftEyeGroup">
        <use href="#singleHeadlight" />
      </g>

      <!-- RIGHT HEADLIGHT (Mirrored across center X=340) -->
      <g id="rightEyeGroup" transform="translate(680, 0) scale(-1, 1)">
        <use href="#singleHeadlight" />
      </g>
    </svg>
  </div>

  <!-- TITLE & SUBTITLE -->
  <div class="title-section">
    <div class="title-jarvis">J&#923;RVIS</div>
    <div class="subtitle-jarvis">YOUR PERSONAL AI ASSISTANT</div>
  </div>

  <!-- SLEEK HEARTBEAT WAVEFORM (NO CONTAINER, NO BRACKETS) -->
  <div class="wave-container">
    <canvas id="waveformCanvas" width="280" height="54"></canvas>
  </div>
</div>

<script>
  // Elements
  const eyesWrapper = document.getElementById('eyesWrapper');
  const canvas = document.getElementById('waveformCanvas');
  const ctx = canvas.getContext('2d');
  const mainContainer = document.getElementById('mainContainer');
  const outerPupils = document.querySelectorAll('.outer-pupil');
  const innerPupils = document.querySelectorAll('.inner-pupil');

  // Interactive tap triggers assistant
  mainContainer.addEventListener('click', () => {
    if (window.AndroidInterface && window.AndroidInterface.onOrbClicked) {
      window.AndroidInterface.onOrbClicked();
    }
  });

  // State
  let currentAmplitude = 0.0;
  let targetAmplitude = 0.0;
  let isSpeaking = false;
  let time = 0;
  let heartbeatCycle = 0;

  // Eye Saccades (Autonomous Micro-Glances)
  let pupilTargetX = 0;
  let pupilTargetY = 0;
  let pupilCurrentX = 0;
  let pupilCurrentY = 0;

  function scheduleNextGlance() {
    const delay = 1600 + Math.random() * 2600;
    setTimeout(() => {
      // Natural subtle eye saccade: look slightly left, right, or center
      pupilTargetX = (Math.random() - 0.5) * 5.0;
      pupilTargetY = (Math.random() - 0.5) * 2.5;
      scheduleNextGlance();
    }, delay);
  }
  scheduleNextGlance();

  // Autonomous Natural Blinking
  function scheduleNextBlink() {
    const delay = 3800 + Math.random() * 3500;
    setTimeout(() => {
      eyesWrapper.classList.add('blink');
      setTimeout(() => {
        eyesWrapper.classList.remove('blink');
        scheduleNextBlink();
      }, 230);
    }, delay);
  }
  scheduleNextBlink();

  // Mathematical ECG (Electrocardiogram) Cardiac Waveform Formula
  function getEcgSpike(phase, energy) {
    // phase runs from 0.0 to 1.0 per heartbeat
    const amp = Math.max(0.0, energy);

    // 0.0 to 0.28: Resting baseline with delicate micro-tension
    if (phase < 0.28) {
      return Math.sin(phase * Math.PI * 8) * (0.4 + amp * 0.8);
    }
    // 0.28 to 0.38: P-Wave (Smooth atrium depolarization)
    if (phase < 0.38) {
      const p = (phase - 0.28) / 0.10;
      return Math.sin(p * Math.PI) * (4.2 + amp * 5.5);
    }
    // 0.38 to 0.44: PR Segment (Flat transition)
    if (phase < 0.44) {
      return 0.0;
    }
    // 0.44 to 0.48: Q-Dip (Sharp negative dip)
    if (phase < 0.48) {
      const q = (phase - 0.44) / 0.04;
      return -Math.sin(q * Math.PI) * (4.5 + amp * 8.0);
    }
    // 0.48 to 0.55: R-Peak (Main intense systolic spike reaching apex)
    if (phase < 0.55) {
      const r = (phase - 0.48) / 0.07;
      return Math.sin(r * Math.PI) * (21.5 + amp * 15.0);
    }
    // 0.55 to 0.61: S-Plunge (Sharp plunge below baseline)
    if (phase < 0.61) {
      const s = (phase - 0.55) / 0.06;
      return -Math.sin(s * Math.PI) * (9.5 + amp * 9.0);
    }
    // 0.61 to 0.67: ST Segment
    if (phase < 0.67) {
      return 0.0;
    }
    // 0.67 to 0.80: T-Wave (Ventricular repolarization wave)
    if (phase < 0.80) {
      const t = (phase - 0.67) / 0.13;
      return Math.sin(t * Math.PI) * (5.5 + amp * 6.0);
    }
    // 0.80 to 1.0: Baseline recovery
    return 0.0;
  }

  function renderWaveform() {
    time += 0.016;
    // Smooth audio response dampening
    currentAmplitude += (targetAmplitude - currentAmplitude) * 0.20;

    // Heart rate (BPM): 66 BPM idle, accelerates with speech
    const bpmSpeed = (isSpeaking || currentAmplitude > 0.04) ? (1.35 + currentAmplitude * 0.9) : 0.82;
    heartbeatCycle = (heartbeatCycle + 0.016 * bpmSpeed) % 1.0;

    // Pupil micro-saccades interpolation
    pupilCurrentX += (pupilTargetX - pupilCurrentX) * 0.10;
    pupilCurrentY += (pupilTargetY - pupilCurrentY) * 0.10;

    // Apply micro-saccade offset to pupils
    const pupilTransform = `translate(${pupilCurrentX.toFixed(2)}px, ${pupilCurrentY.toFixed(2)}px)`;
    outerPupils.forEach(el => el.style.transform = pupilTransform);
    innerPupils.forEach(el => el.style.transform = pupilTransform);

    const w = canvas.width;
    const h = canvas.height;
    const centerY = h / 2;

    ctx.clearRect(0, 0, w, h);

    // Compute heartbeat points across width
    const points = [];
    const step = 2; // high resolution 2px step
    const energy = (isSpeaking ? 0.65 : 0.0) + currentAmplitude * 1.3;

    for (let x = 0; x <= w; x += step) {
      const normalizedX = x / w;
      // Phase along the canvas width, animated by heartbeatCycle
      const pointPhase = (normalizedX - heartbeatCycle + 2.0) % 1.0;
      const spike = getEcgSpike(pointPhase, energy);

      // Voice harmonic ripple when speaking or audio detected
      let voiceRipple = 0;
      if (energy > 0.05) {
        voiceRipple = Math.sin(x * 0.28 + time * 14.0) * energy * 2.8 * Math.sin(normalizedX * Math.PI);
      }

      // Sleek edge taper (fades to 0 at extreme left and right)
      let edgeTaper = 1.0;
      if (x < 32) edgeTaper = x / 32;
      else if (x > w - 32) edgeTaper = (w - x) / 32;

      const y = centerY - (spike + voiceRipple) * edgeTaper;
      points.push({ x, y, edgeTaper, pointPhase });
    }

    if (points.length === 0) {
      requestAnimationFrame(renderWaveform);
      return;
    }

    // 1. Ambient Background Trace Glow
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = isSpeaking ? 'rgba(255, 50, 50, 0.45)' : 'rgba(239, 68, 68, 0.28)';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#FF1111';
    ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.restore();

    // 2. Crisp Blazing Red Neon Pass
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = isSpeaking ? 'rgba(255, 60, 60, 0.95)' : 'rgba(255, 45, 45, 0.85)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#FF3333';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.restore();

    // 3. Ultra-Sleek White-Hot Laser Core Line
    ctx.save();
    const coreGrad = ctx.createLinearGradient(0, 0, w, 0);
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    coreGrad.addColorStop(0.12, 'rgba(255, 255, 255, 0.7)');
    coreGrad.addColorStop(0.5, isSpeaking ? 'rgba(255, 255, 255, 1.0)' : 'rgba(255, 240, 240, 0.9)');
    coreGrad.addColorStop(0.88, 'rgba(255, 255, 255, 0.7)');
    coreGrad.addColorStop(0.5, isSpeaking ? 'rgba(255, 255, 255, 1.0)' : 'rgba(255, 240, 240, 0.9)');
    coreGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = coreGrad;
    ctx.lineWidth = 1.1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();

    // 4. Luminous Traveling Heartbeat Pulse Spark
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (Math.abs(p.pointPhase - 0.515) < 0.025 && p.edgeTaper > 0.4) {
        ctx.save();
        ctx.shadowColor = '#FFFFFF';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2 + energy * 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#FF2222';
        ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(255, 50, 50, 0.6)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5.0 + energy * 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      }
    }

    requestAnimationFrame(renderWaveform);
  }

  requestAnimationFrame(renderWaveform);

  // External Native Android Hooks
  window.setAudioAmplitude = function(rms) {
    const val = Math.min(1.0, Math.max(0.0, rms));
    targetAmplitude = val;
  };

  window.setOrbState = function(stateName) {
    if (stateName === 'SPEAKING') {
      isSpeaking = true;
      eyesWrapper.classList.add('speaking');
    } else {
      isSpeaking = false;
      eyesWrapper.classList.remove('speaking');
      if (stateName === 'IDLE') {
        targetAmplitude = 0.0;
      }
    }
  };

  window.setLatestResponse = function(text) {};
</script>

</body>
</html>
